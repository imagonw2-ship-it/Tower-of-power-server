  <div id="touchControls" aria-label="Game controls">
    <div id="touchLookZone" aria-label="Drag to look"></div>
    <div id="joyBase" aria-label="Move; push to the outer edge to run"><div id="joyKnob"></div><span id="joyRun">RUN</span></div>
    <button class="touchBtn" id="touchPickup" aria-label="Pick up item" hidden><svg><use href="#icon-pickup"/></svg><span>PICK UP</span></button>
    <div id="touchActions">
      <button class="touchBtn" id="touchKit" aria-label="Open field kit"><svg><use href="#icon-kit"/></svg><span>KIT</span></button>
      <button class="touchBtn" id="touchAim" aria-label="Change zoom"><svg><use href="#icon-zoom"/></svg><span id="touchZoomLabel">1×</span></button>
      <button class="touchBtn" id="touchCrouch" aria-label="Toggle crouch" aria-pressed="false"><svg><use href="#icon-crouch"/></svg><span>CROUCH</span></button>
      <button class="touchBtn" id="touchUse" aria-label="Take a photo"><svg><use id="touchUseIcon" href="#icon-camera"/></svg><span id="touchUseLabel">PHOTO</span></button>
    </div>
    <button id="touchPause" aria-label="Pause"><svg><use href="#icon-pause"/></svg></button>
    <div hidden aria-hidden="true"><button id="touchSprint"></button><button id="touchLight"></button><button id="touchCamera"></button><button id="touchSoda"></button><button id="touchZoomIn"></button><button id="touchZoomOut"></button><button id="touchWorld"></button></div>
  </div>
