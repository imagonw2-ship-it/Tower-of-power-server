<section id="fieldKit" role="dialog" aria-modal="true" aria-labelledby="kitTitle" hidden>
 <div class="kitSheet">
  <header><h2 id="kitTitle">Inventory</h2><button id="kitClose" aria-label="Close inventory">×</button></header>
  <div class="kitLayout">
   <section class="kitHand"><h3>MAIN HAND</h3><button id="handSlot" class="kitSlot" aria-label="Empty hand"><svg><use id="handIcon" href="#icon-camera"/></svg><strong id="handName">Camera</strong><span id="handHint">UNEQUIP</span></button><button id="kitDrop"><svg><use href="#icon-drop"/></svg><span>DROP</span></button></section>
   <section class="kitBag"><h3>BACKPACK</h3><div class="kitPockets" role="group" aria-label="Backpack">
    <button class="kitCard kitSlot" data-tool="camera" draggable="true" aria-pressed="true"><svg><use href="#icon-camera"/></svg><strong>Camera</strong><span class="kitDetail">Flash photograph</span><span class="kitTag">IN HAND</span></button>
    <button class="kitCard kitSlot" data-tool="flashlight" draggable="true" aria-pressed="false"><svg><use href="#icon-flashlight"/></svg><strong>Flashlight</strong><span class="kitDetail">Find in shed</span><span class="kitTag">NOT COLLECTED</span></button>
    <button class="kitCard kitSlot" data-tool="soda" draggable="true" aria-pressed="false"><svg><use href="#icon-soda"/></svg><strong>Soda <b id="kitSodas">0</b></strong><span class="kitDetail">Speed boost</span><span class="kitTag">EMPTY</span></button>
    <button class="kitCard kitSlot" data-tool="flare" draggable="true" aria-pressed="false"><svg><use href="#icon-flare"/></svg><strong>Flare gun <b id="kitFlares">0</b></strong><span class="kitDetail">Noise distraction</span><span class="kitTag">NOT COLLECTED</span></button><div class="kitSlot kitEmpty"></div><div class="kitSlot kitEmpty"></div><div class="kitSlot kitEmpty"></div><div class="kitSlot kitEmpty"></div><div class="kitSlot kitEmpty"></div>
   </div></section>
  </div>
  <footer><span id="kitStatus">Select an item to equip it.</span><span class="kitKeyTip">I / ESC TO CLOSE</span></footer>
 </div>
</section>
<button id="desktopKit" aria-label="Open inventory"><svg><use href="#icon-kit"/></svg><span id="equippedName">CAMERA</span><kbd>I</kbd></button>
<div id="touchLesson" hidden></div>
