<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><defs>
  <symbol id="icon-camera" viewBox="0 0 24 24"><path d="M4 7h4l2-3h4l2 3h4v13H4z"/><circle cx="12" cy="13" r="4"/><path d="M18 9h.01"/></symbol>
  <symbol id="icon-flashlight" viewBox="0 0 24 24"><path d="m5 3 6 1 3 6-4 4-6-3-1-6zM10 14l7 7 4-4-7-7M15 4l2-2M19 8l3-1M17 6l3-3"/></symbol>
  <symbol id="icon-soda" viewBox="0 0 24 24"><path d="M7 4h10v16H7zM7 7h10M7 17h10M10 4V2h4v2M10 11l4-1-1 4"/></symbol>
  <symbol id="icon-kit" viewBox="0 0 24 24"><path d="M8 6V4h8v2M5 6h14l2 4v10H3V10zM3 11h18M9 10v3h6v-3"/></symbol>
  <symbol id="icon-crouch" viewBox="0 0 24 24"><circle cx="14" cy="4" r="2"/><path d="m12 8-4 4 7 3-3 6M12 8l4 4h5M8 12l-4 3v6M9 21h5"/></symbol>
  <symbol id="icon-pickup" viewBox="0 0 24 24"><path d="M8 12V5a2 2 0 0 1 4 0v7-9a2 2 0 0 1 4 0v9-6a2 2 0 0 1 4 0v10l-4 5H9l-6-7a2 2 0 0 1 3-2l2 2"/></symbol>
  <symbol id="icon-zoom" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6M7 10h6M10 7v6"/></symbol>
  <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
</defs></svg>
<section id="fieldKit" role="dialog" aria-modal="true" aria-labelledby="kitTitle" hidden>
  <div class="kitSheet">
    <header><div><p class="kitEyebrow">YOUR EQUIPMENT</p><h2 id="kitTitle">FIELD KIT</h2></div><button id="kitClose" aria-label="Close field kit">×</button></header>
    <p class="kitLead">Choose what your Use button does. Collected supplies stay in your kit.</p>
    <div class="kitPockets" role="group" aria-label="Equipment">
      <button class="kitCard" data-tool="camera" aria-pressed="true"><span class="kitNumber">01 / TOOL</span><svg><use href="#icon-camera"/></svg><strong>Camera</strong><span class="kitDetail">Flash photograph</span><span class="kitTag">READY</span></button>
      <button class="kitCard" data-tool="flashlight" aria-pressed="false"><span class="kitNumber">02 / LIGHT</span><svg><use href="#icon-flashlight"/></svg><strong>Flashlight</strong><span class="kitDetail">Find it in the shed</span><span class="kitTag">NOT COLLECTED</span></button>
      <button class="kitCard" data-tool="soda" aria-pressed="false"><span class="kitNumber">03 / SUPPLY</span><svg><use href="#icon-soda"/></svg><strong>Soda <b id="kitSodas">0</b></strong><span class="kitDetail">15-second speed boost</span><span class="kitTag">EMPTY</span></button>
    </div>
    <footer><span id="kitStatus">Select a tool to equip it.</span><span>I / ESC TO CLOSE</span></footer>
  </div>
</section>
<button id="desktopKit" aria-label="Open field kit"><svg><use href="#icon-kit"/></svg><span id="equippedName">CAMERA</span><kbd>I</kbd></button>
<div id="touchLesson" hidden>LEFT THUMB: MOVE · PUSH TO THE EDGE TO RUN<br>RIGHT THUMB: LOOK · KIT: CHOOSE A TOOL</div>
