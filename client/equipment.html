<section id="fieldKit" role="dialog" aria-modal="true" aria-labelledby="kitTitle" hidden>
 <div class="kitSheet">
  <header><h2 id="kitTitle">Inventory</h2><button id="kitClose" aria-label="Close inventory">×</button></header>
  <div class="kitLayout">
   <section class="kitHand"><h3>MAIN HAND</h3><button id="handSlot" class="kitSlot" aria-label="Empty hand"><canvas id="handPreview" class="itemPreview" width="256" height="192" aria-hidden="true"></canvas><strong id="handName">Camera</strong><span id="handHint">UNEQUIP</span></button><button id="kitDrop"><svg><use href="#icon-drop"/></svg><span>DROP</span></button></section>
   <section class="kitBag"><h3>BACKPACK</h3><div class="kitPockets" role="group" aria-label="Backpack">
    <button class="kitCard kitSlot" data-tool="camera" draggable="true" aria-pressed="true"><canvas class="itemPreview" data-preview="camera" width="256" height="192" aria-hidden="true"></canvas><strong>Camera</strong><span class="kitDetail">Flash photograph</span><span class="kitTag">IN HAND</span></button>
    <button class="kitCard kitSlot" data-tool="flashlight" hidden draggable="true" aria-pressed="false"><canvas class="itemPreview" data-preview="flashlight" width="256" height="192" aria-hidden="true"></canvas><strong>Flashlight</strong><span class="kitDetail">Find in shed</span><span class="kitTag">EQUIP</span></button>
    <button class="kitCard kitSlot" data-tool="soda" hidden draggable="true" aria-pressed="false"><canvas class="itemPreview" data-preview="soda" width="256" height="192" aria-hidden="true"></canvas><strong>Soda <b id="kitSodas">0</b></strong><span class="kitDetail">Speed boost</span><span class="kitTag">EQUIP</span></button>
    <button class="kitCard kitSlot" data-tool="flare" hidden draggable="true" aria-pressed="false"><canvas class="itemPreview" data-preview="flare" width="256" height="192" aria-hidden="true"></canvas><strong>Flare gun <b id="kitFlares">0</b></strong><span class="kitDetail">Noise distraction</span><span class="kitTag">EQUIP</span></button><div class="kitSlot kitEmpty" aria-hidden="true"></div><div class="kitSlot kitEmpty" aria-hidden="true"></div><div class="kitSlot kitEmpty" aria-hidden="true"></div><div class="kitSlot kitEmpty" aria-hidden="true"></div><div class="kitSlot kitEmpty" aria-hidden="true"></div><div class="kitSlot kitEmpty" aria-hidden="true"></div><div class="kitSlot kitEmpty" aria-hidden="true"></div><div class="kitSlot kitEmpty" aria-hidden="true"></div><div class="kitSlot kitEmpty" aria-hidden="true"></div>
   </div></section>
  </div>
  <footer><span id="kitStatus">Select an item to equip it.</span><span class="kitKeyTip">I / ESC TO CLOSE</span></footer>
 </div>
</section>
<button id="desktopKit" aria-label="Open inventory"><svg><use href="#icon-kit"/></svg><span id="equippedName">CAMERA</span><kbd>I</kbd></button>
<div id="touchLesson" hidden></div>

<div id="staminaBar" role="progressbar" aria-label="Stamina" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span id="staminaFill"></span></div>
<div id="voiceHud" hidden title="Microphone audio is heard nearby. Forest mimics may repeat short clips; clips are erased when you mute or leave."><button id="voiceToggle" aria-label="Enable proximity microphone" aria-pressed="false"><svg><use id="voiceIcon" href="#icon-mic-off"/></svg></button><span id="voiceStatus" role="status">MIC OFF</span><label class="voiceVolumeLabel">Voice <input id="voiceVolume" type="range" min="0" max="1" step=".05" value=".85" aria-label="Nearby voice volume"></label></div>
